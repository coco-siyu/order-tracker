apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $INCIDENT_WEBHOOK_TOKEN
          maxAlerts: "10"

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [alertname, grafana_folder]
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 4h
